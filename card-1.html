<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation</title>

<style>
body {
  margin:0;
  font-family:'Georgia', serif;
  background:#fffaf5;
  color:#6b4f3b;
}

.hero {
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:linear-gradient(rgba(255,250,245,0.8), rgba(255,250,245,0.9)), url('moka wedding.jpg') center/cover;
}

.hero h1 {
  font-size:40px;
  margin:10px 0;
}

.hero p {
  font-size:18px;
  letter-spacing:2px;
}

.btn {
  margin-top:20px;
  padding:12px 30px;
  background:#d4af7f;
  color:white;
  border:none;
  border-radius:30px;
  cursor:pointer;
}

section {
  padding:60px 20px;
  text-align:center;
}

.card {
  max-width:600px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.gallery {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}

.gallery img {
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:10px;
}

.countdown {
  font-size:22px;
  color:#d4af7f;
  margin-top:10px;
}

.fade {
  opacity:0;
  transform:translateY(30px);
  transition:1s;
}

.fade.show {
  opacity:1;
  transform:translateY(0);
}

footer {
  text-align:center;
  padding:20px;
  font-size:14px;
}

</style>
</head>

<body>

<div class="hero">
  <p>You're Invited</p>
  <h1>Zidan & Eka</h1>
  <p>12 • 12 • 2026</p>
  <button class="btn" onclick="scrollToSection()">Lihat Undangan</button>
</div>

<section class="fade">
  <div class="card">
    <h2>Wedding Event</h2>
    <p>Sabtu, 12 Desember 2026</p>
  <a href="https://maps.app.goo.gl/tbjvRJBmnggpHLH79" target="_blank">keboen Radja</a>
    <div id="countdown" class="countdown"></div>
  </div>
</section>

<section class="fade">
  <h2>Prewedding</h2>
  <div class="gallery">
    <img src="download (23).jpg">
    <img src="download (18).jpg">
    <img src="mb ekaa🤩.jpg">
  </div>
</section>

<section class="fade">
  <div class="card">
    <h2>RSVP</h2>
    <button class="btn" onclick="alert('Terima kasih 💖')">Konfirmasi Kehadiran</button>
  </div>
</section>

<footer>
  <p>With Love ❤</p>
</footer>

<script>
function scrollToSection(){
  window.scrollTo({ top: window.innerHeight, behavior:'smooth' });
}

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      entry.target.classList.add('show');
    }
  });
});

document.querySelectorAll('.fade').forEach(el => observer.observe(el));

const countDate = new Date("Dec 12, 2026 00:00:00").getTime();
setInterval(()=>{
  const now = new Date().getTime();
  const gap = countDate - now;
  const h = Math.floor((gap%(1000*60*60*24))/(1000*60*60));
  const m = Math.floor((gap%(1000*60*60))/(1000*60));
  document.getElementById('countdown').innerHTML = " "+h+" Jam "+m+" Menit";
},1000);
</script>

</body>
</html>
